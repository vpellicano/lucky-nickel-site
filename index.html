<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Nickel Company — Coming Soon</title>
<meta name="description" content="Lucky Nickel Company. Small-batch goods, stirred with intention. Coming soon.">
<meta property="og:title" content="Lucky Nickel Company">
<meta property="og:description" content="Small-batch goods, stirred with intention. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23b8b3a7'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%237d786d' stroke-width='2'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%233d3a33'%3ELN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #12111a;
    --ink-soft: #1b1a26;
    --nickel: #c9c4b8;
    --nickel-deep: #8f8a7e;
    --cream: #efe9dc;
    --faded: #9b96a8;
    --lucky: #d8a94e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% -10%, var(--ink-soft) 0%, var(--ink) 60%);
    color: var(--cream);
    font-family: "Inter", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.25rem;
  }
  main { max-width: 40rem; }

  .coin {
    width: 92px;
    height: 92px;
    margin: 0 auto 2.75rem;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #e8e3d6 0%, var(--nickel) 42%, var(--nickel-deep) 100%);
    box-shadow:
      inset 0 0 0 5px rgba(61, 58, 51, .25),
      inset 0 2px 6px rgba(255, 255, 255, .55),
      0 10px 34px rgba(0, 0, 0, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: gleam 7s ease-in-out infinite;
    position: relative;
  }
  .coin span {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: .06em;
    color: #3d3a33;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  .coin::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(216, 169, 78, .28);
    animation: halo 7s ease-in-out infinite;
  }
  @keyframes gleam {
    0%, 100% { transform: translateY(0) rotate(-4deg); filter: brightness(1); }
    50%      { transform: translateY(-7px) rotate(4deg); filter: brightness(1.12); }
  }
  @keyframes halo {
    0%, 100% { opacity: .35; transform: scale(1); }
    50%      { opacity: .9;  transform: scale(1.06); }
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    letter-spacing: .18em;
    text-transform: uppercase;
    line-height: 1.12;
  }
  h1 small {
    display: block;
    font-size: clamp(1rem, 3vw, 1.4rem);
    letter-spacing: .58em;
    margin-top: .55rem;
    padding-left: .58em; /* optically recenters wide tracking */
    color: var(--faded);
  }

  .rule {
    width: 64px;
    height: 1px;
    margin: 2.1rem auto;
    background: linear-gradient(90deg, transparent, var(--lucky), transparent);
  }

  .soon {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    color: var(--lucky);
    letter-spacing: .04em;
  }
  .tag {
    margin-top: 1.1rem;
    font-weight: 300;
    font-size: .95rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faded);
  }

  footer {
    margin-top: 4.5rem;
    font-size: .85rem;
    letter-spacing: .08em;
    color: var(--faded);
  }
  footer .hexy {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cream);
  }
  footer .star { color: var(--lucky); }
  footer p + p { margin-top: .8rem; font-size: .72rem; letter-spacing: .12em; }
</style>
</head>
<body>
<main>
  <div class="coin" aria-hidden="true"><span>LN</span></div>
  <h1>Lucky Nickel<small>Company</small></h1>
  <div class="rule"></div>
  <p class="soon">Coming soon</p>
  <p class="tag">Small-batch goods, stirred with intention</p>
  <footer>
    <p><span class="star">&#10022;</span> conjured by <span class="hexy">Hexy Bexy</span> <span class="star">&#10022;</span></p>
    <p>&copy; 2026 Lucky Nickel Company LLC</p>
  </footer>
</main>
</body>
</html>
